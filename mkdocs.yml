site_name: Celune Docs
site_description: Local-first expressive voice, Persona, agent, and voice-conversion engine.
site_url: https://celune.readthedocs.io/en/latest/
repo_url: https://github.com/celunah/celune
repo_name: celunah/celune

strict: true
docs_dir: docs

extra_css:
  - assets/stylesheets/celune.css

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start:
      - Installation: getting-started/installation.md
      - First run: getting-started/first-run.md
  - Guide:
      - Config: user-guide/configuration.md
      - Modes: user-guide/modes.md
      - Speech: user-guide/speech.md
      - Persona: user-guide/persona.md
      - Agent: user-guide/agent.md
      - Voice conversion: user-guide/voice-conversion.md
      - Troubleshooting: troubleshooting.md
  - Interfaces:
      - CLI: interfaces/cli.md
      - TUI: interfaces/tui.md
      - REST API: API.md
      - Extensions: interfaces/extensions.md
  - Formats:
      - CEVOICE/CECHAR: CEVOICE.md
      - CEDTS transport: formats/cedts.md
      - Persona Markdown: formats/persona-markdown.md
  - Reference:
      - Python API: reference/public-api.md
      - Source map: reference/source-map.md
      - Voice design: VOICES.md
      - Gallery: GALLERY.md
  - Dev:
      - Architecture: development/architecture.md
      - Backends: development/backends.md
      - Docs standard: development/documentation.md
      - Testing: development/testing.md
      - Voice and pack design: development/voice-analysis.md
      - Validation: development/validation.md
      - Packaging: development/packaging.md
      - Licensing: licensing.md
