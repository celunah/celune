# Backend selection
#
# you will be asked to choose, but VRAM presets may limit availability
# of certain backends
#
# `qwen3` = faster, less expressive
# `ming3` = low latency, inexpensive
# `dotstts` = slower, very high quality
# `voxcpm2` = slower, high quality
# `mini` = much faster, and just as good
# `soulxsinger` = singing mode
# `seed-vc` = voice conversion mode
backend: null

# Model license usage policy
#
# `false` = allow models after their normal license consent prompt
# `true` = allow only models whose reviewed terms confirm commercial use
commercial: false

# Runtime TTS weight quantization
#
# `false` = keep loading TTS weights in BF16, requires more memory
# `true` = use INT8 on Ampere (sm86) and FP8 on Ada Lovelace (sm89) or newer when supported,
# falls over to BF16, and signals fatal if both methods fail
quantize: true

# Persona and TTS KV-cache quantization
#
# `true` = store supported cache prefixes in INT8 on Ampere, FP8 on Ada Lovelace or newer
# `false` = keep KV cache dtypes unmodified
quantize_kv_cache: true

# Qwen3 TTS settings
#
# full reference conditioning preserves the reference prosody and expression
# set this to `true` when stronger speaker identity matters more than expression
qwen3_x_vector_only: false

# Backend specific settings
#
# these settings will only apply to their target backends
backend_options:
  soulxsinger:
    # use two-pass singing generation for improved pitch control and advanced musical features
    high_precision: true
    # generate singing in chunks while preserving CESN event behavior across them
    streaming: false

# Character selection
#
# this selects the character who you will have speak or talk with you
#
# use one of the four bundled packs: three variants of Celune in the `default` packs, Nol in `nol`
# more characters can be generated for use in Celune, check `scripts/cac.py` or use your AI agent with
# the bundled voice pack creator skill for an automatic workflow
voice_bundle: default

# Log level settings
#
# `info` = only user-facing statuses
# `verbose` = detailed runtime status
# `debug` = every event logged + a debug menu (press CTRL+B)
log_level: info

# Locale settings
#
# `null` = auto-detect from the current system locale
# `...` = use language file for the specified locale
#
# non-existing locales will fall back to raw keys
locale: null

# Audio device settings
#
# set either key to a sounddevice device name or numeric index
# null = use the current system default device
#
# on Windows, set audio_api to wasapi or directsound to disambiguate devices that
# appear more than once under different host APIs
# set it to "null" to use Celune's default: "wasapi"
audio_api: null
#
# if the specified device name has several matches, Celune will list the possible device
# entries and request you to select one and restart the application after selecting it
input_device: null
output_device: null

# Headless mode
#
# this will disable the UI and only API, WebUI, MCP servers, or extensions can make
# Celune perform any actions
# `null` - auto-detect the session and start in a compatible mode
# `false` - force full mode
# `true` - force headless mode
headless: false
# use only VGA white while in headless mode
headless_nocolor: false

# Theme preference
#
# character packs can override the theme colors
# this selects whether Celune prefers dark or light theme
theme: dark

# YouTube download settings
#
# `yt-dlp` may use these optional values when downloading YouTube URLs before sending them to the pipeline
# do not post your cookies or PO tokens publicly, Celune does not log or send it anywhere
youtube:
  # select a cookie file
  cookies_file: null
  # obtain a cookie from your browser
  cookies_from_browser: null
  # one or more values, such as `web.gvs+TOKEN` or `web.player+TOKEN`
  po_token: null
  # one or more clients, such as `web_embedded` or `android_vr`
  player_client: null
  # one or more runtimes by location or from PATH, e.g. `deno` or `node:C:/Program Files/nodejs/node.exe`
  js_runtimes: null
  # e.g. `ejs:npm` when using Deno or Bun
  remote_components: null
  # extra arguments to provide to `yt-dlp`
  extractor_args: []

# CeluneNorm settings
#
# CeluneNorm is Celune's normalizer that cleans up your text to be more TTS friendly
# AI normalizers may occasionally misinterpret your input, set it to `false` if it bothers you
use_normalizer: false

# Caption display
#
# `espeak-ng` is required to align captions, unaligned captions are refused by the engine
captions: false

# IPA auto-conversion
# Celune can auto-convert IPA strings into English-like approximations
# if you want to try speaking the IPA raw, disable this feature
# this may break speech with some models
#
# false = IPA is converted to English like compounds
# true = IPA is treated as is
ipa: false

# Global operation mode:
# `performance` - manual voice operation, no Persona, agentic features, or other autonomous actions
# `converse` - Persona conversation without agentic features, singing unavailable
# `agent` - automatic Persona/agent routing, singing unavailable
mode: performance

# Agent settings
# Celune can act autonomously when set to `agent` mode
agent:
  # use file management tools
  fs_tools: true
  # how many agent loops are permitted before the task is aborted
  max_loops: 20
  # how many tokens are allowed to be consumed before the task is aborted
  max_tokens: null
  # how many tokens is the agent allowed to use at one time
  context_size: 8192

# VRAM target settings
# we recommend choosing medium as a safe baseline for low VRAM users
# the sane choice for users wanting to use Persona is the high preset
#
# low (6GB) - 4GB reserved
# medium (8GB) - 6GB reserved
# high (12GB) - 10GB reserved, Persona standard models
# xhigh (16GB+) - 14GB reserved, Persona standard and smart models
vram: medium

# Sleep mode behavior
#
# Celune can automatically enter sleep mode to save your resources while idle
sleep:
  # should Celune sleep?
  enabled: true
  # how long to idle for in minutes before going to sleep
  timeout: 10
  # what to unload when entering sleep mode?
  unload:
    # disable Persona's VLM/LLM
    persona: true
    # disable CeluneNorm
    normalizer: true
    # disable the TTS backend
    tts: true

# Celune API settings
#
# Celune API allows users to interact with Celune and lets other devices use her abilities
api:
  enabled: true
  # `same_machine` = localhost, `same_network` = all local interfaces,
  # `everyone` = localhost over a temporary Cloudflare tunnel
  access: same_machine
  # what network port to bind
  port: 2060
  # what authentication token users must use
  # `null` will generate and store a key in Celune's app-data directory
  # the token can also be set with `CELUNE_API_TOKEN`
  token: null
  # how many generations are allowed every minute
  # strongly recommended for public APIs
  rate_limit_per_minute: 60

# Persona settings
#
# Persona is Celune's thinking system using RAG (Retrieval Augmented Generation) to let characters
# keep a conversational context and remember you as you speak with said characters
# it is recommended to use Qwen3-VL or a compatible finetune for best results
persona:
  # how many tokens to reserve
  # more context will use more VRAM
  context_size: 2048
  # how much of the context space in percent needs to be taken before compaction occurs
  # compacting too late may harm outputs, compacting too early may cause loss of context
  compact_at: 75
  # context hard cap
  # `null` will be unlimited, else the context will limit at N exchanges
  max_turns: null
  # load same-named Persona Markdown files from the Celune app-data character directory
  debug_overrides: false
  # which model to use? (in case you want to use a different model)
  model_id: Qwen/Qwen3-VL-4B-Instruct
  # model_id: huihui-ai/Huihui-Qwen3-VL-4B-Instruct-abliterated
  # Hugging Face Whisper model used by CTRL+R Persona voice input
  speech_model_id: openai/whisper-large-v3-turbo
  # Whisper language code/name, or auto to detect the spoken language
  speech_language: auto
  # Extra silence after VAD stops hearing speech before submitting voice input
  speech_end_delay_seconds: 1.5
  # memory settings
  memory:
    # how much do you want Celune to remember
    max_short_term_messages: 20
    # use the local Persona model to classify durable facts not matched by rules
    auto_classifier: true
    auto_classifier_min_confidence: 0.82
    auto_classifier_max_candidates: 3
    # stop retrieving inferred memories after this many days; null disables expiry
    automatic_max_age_days: 60
    # summarize older turns instead of carrying the complete history forward
    context_compaction_enabled: true
    context_compaction_keep_recent_messages: 8
    context_summary_max_characters: 1200
    # optional root for character-scoped records at <character>/memory/records.json
    storage_dir: null
    # minimum cosine similarity for semantic long-term memory retrieval
    semantic_similarity_threshold: 0.62
    # token overlap required by the safe fallback matcher when embeddings are unavailable
    fallback_token_overlap_threshold: 1
    # transformer model used for semantic long-term memory retrieval when available locally
    semantic_embedding_model: sentence-transformers/all-MiniLM-L6-v2
