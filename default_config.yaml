# backend
# you will be asked to choose, but VRAM presets may limit availibility
# of certain backends
#
# qwen3 = faster, less expressive
# dotstts = slower, very high quality
# voxcpm2 = slower, high quality
# mini = much faster, and just as good
# seed-vc = VC backend, converts speech rather than generating it
backend: null

# Qwen3 TTS settings
#
# x-vectors make Celune adhere to the reference more strongly
qwen3_x_vector_only: true

# CEVOICE voice selection
#
# default voices are in the "default" pack and are usable for most
# check scripts\cac.py to create your own custom voice pack by following
# step by step instructions
voice_bundle: default

# developer mode
#
# this will enable verbose logging, detailed tracebacks,
# and auto-voice analysis upon end of utterance
dev: false

# voice conversion default settings
#
# positive values raise the converted voice, negative values lower it
# useful for helping cross-gender conversions land more naturally
voice_conversion_pitch_shift: 0
# false = talk mode, true = sing mode
voice_conversion_f0_condition: false

# audio device settings
#
# set either key to a sounddevice device name or numeric index
# null = use the current system default device
#
# on Windows, set audio_api to wasapi or directsound to disambiguate devices that
# appear more than once under different host APIs
audio_api: null
#
# if the specified device name has several matches, Celune will list the possible device
# entries and request you to select one and restart the application after selecting it
input_device: null
output_device: null

# headless mode / Celune embedded framework
#
# this will disable the UI and only API and extensions can make
# Celune perform any actions
headless: false
# don't use ANSI colors in headless interface (defaulting to white)
headless_nocolor: false

# theme palette
#
# CEVOICE packs can define how the app theme looks like
# the default uses #CEBAFF accent and #1D1826 background colors
theme: dark

# CeluneNorm settings
#
# CeluneNorm is Celune's normalizer that cleans up your text to be more TTS friendly
use_normalizer: false

# smart speech buffering
#
# Celune can adapt its pre-playback buffer to recent and live generation speed
# so slower generations build more headroom while fast realtime generations
# start speaking immediately
smart_buffer:
  enabled: true
  realtime_speed: 1.05
  protected_playback_seconds: 20.0
  minimum_seconds: 0.35
  min_speed_sample_seconds: 0.75
  max_seconds: 20.0
  complete_below_speed: 0.5

# IPA auto-conversion
# Celune can auto-convert IPA strings into English-like approximations
# if you want to try speaking the IPA raw, disable this feature
#
# false = IPA is converted to English like compounds
# true = IPA is treated as is
ipa: false

# VRAM target settings
# we recommend choosing medium as a safe baseline for low VRAM users
# the sane choice for users wanting to use Persona is the high preset
#
# low (CPU/6GB) - Celune Mini (Pocket TTS) / Qwen3 0.6B+ normalizer CPU (caution: choosing Qwen may harm outputs)
# medium (8GB) - Qwen3 1.7B + normalizer CPU
# high (12GB) - Qwen3 1.7B / dots.tts MF / VoxCPM2 + Persona 4-bit + normalizer CPU
# xhigh (16GB+) - everything allowed, including dots.tts MF and VoxCPM2 + Persona 8-bit + normalizer GPU
vram: medium

# sleep mode behavior
#
# Celune can automatically enter sleep mode to save your resources while idle
sleep:
  # should Celune sleep?
  enabled: true
  # how long to idle for in minutes before going to sleep
  timeout: 10
  # what to unload when entering sleep mode?
  unload:
    persona: true
    normalizer: true
    tts: false

# Celune API settings
#
# Celune API allows users to interact with Celune over the network,
# and also lets IoT devices use her abilities
api:
  # enabled?
  enabled: true
  # where to bind
  host: 127.0.0.1
  # what port to bind
  port: 2060
  # what authentication token users must use
  # the token can also be set with CELUNE_API_TOKEN
  token: null
  # how many generations are allowed every minute
  # strongly recommended for public APIs
  rate_limit_per_minute: 60

# Persona settings
#
# Persona is Celune's thinking system using RAG (Retrieval Augmented Generation) to let characters
# keep a conversational context and remember you as you speak with said characters
# it uses Qwen/Qwen3-VL-4B-Instruct to ensure it can run on consumer hardware
persona:
  # enabled?
  enabled: true
  # which Qwen model to use? (in case you want to use an FT or uncensored version)
  model_id: Qwen/Qwen3-VL-4B-Instruct
  # model_id: huihui-ai/Huihui-Qwen3-VL-4B-Instruct-abliterated
  # memory settings
  memory:
    # how much do you want Celune to remember
    max_short_term_messages: 20
    # where semantic long-term memory retrieval should persist data
    storage_dir: null
    # minimum cosine similarity for semantic long-term memory retrieval
    semantic_similarity_threshold: 0.62
    # token overlap required by the safe fallback matcher when embeddings are unavailable
    fallback_token_overlap_threshold: 1
    # transformer model used for semantic long-term memory retrieval when available locally
    semantic_embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # use persona or speak directly?
  talkback: true
