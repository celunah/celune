# backend
# you will be asked to choose, but VRAM presets may limit availibility
# of certain backends
#
# qwen3 = faster, less expressive
# dotstts = slower, very high quality
# voxcpm2 = slower, high quality
# mini = much faster, and just as good
# seed-vc = VC backend, converts speech rather than generating it
backend: null

# install each selected TTS backend into its own user-local environment
isolated_backends: true

# GPT-SoVITS settings
#
# Celune downloads the official GPT-SoVITS source into its user-data directory
# when this is blank. Set this only to use an existing source checkout.
gpt_sovits_root: null
# auto prefers v2ProPlus, then v4, v2Pro, v3, v2, and v1 when their assets exist
gpt_sovits_variant: auto
# optional absolute path to a custom GPT/text-to-semantic checkpoint
# the selected variant still supplies the SoVITS/vocoder checkpoint
gpt_sovits_t2s_weights_path: null

# Qwen3 TTS settings
#
# Full reference conditioning preserves the reference prosody and expression.
# Set this to true when stronger speaker identity matters more than expression.
qwen3_x_vector_only: false

# CEVOICE voice selection
#
# default voices are in the "default" pack and are usable for most
# check scripts\cac.py to create your own custom voice pack by following
# step by step instructions
voice_bundle: default

# logging
#
# info = normal status information
# verbose = advanced runtime information
# debug = low-level engine and IPC diagnostics
log_level: info

# locale
#
# null = auto-detect from the current system locale
# set a language code like en, en-US, or pl to force a specific locale
locale: null

# voice conversion default settings
#
# positive values raise the converted voice, negative values lower it
# useful for helping cross-gender conversions land more naturally
voice_conversion_pitch_shift: 0
# false = talk mode, true = sing mode
voice_conversion_f0_condition: false
# optional AI helpers for live voice conversion input
#
# silero-vad detects real speech more reliably than plain RMS gating
voice_conversion_live_ai_vad: true

# audio device settings
#
# set either key to a sounddevice device name or numeric index
# null = use the current system default device
#
# on Windows, set audio_api to wasapi or directsound to disambiguate devices that
# appear more than once under different host APIs
# set it to "null" to use Celune's default: "wasapi"
audio_api: null
#
# if the specified device name has several matches, Celune will list the possible device
# entries and request you to select one and restart the application after selecting it
input_device: null
output_device: null

# headless mode / Celune embedded framework
#
# this will disable the UI and only API/WebUI and extensions can make
# Celune perform any actions
headless: false
# don't use ANSI colors in headless interface (defaulting to white)
headless_nocolor: false

# theme palette
#
# CEVOICE packs can define how the app theme looks like
# the default uses #CEBAFF accent and #1D1826 background colors
theme: dark

# CeluneNorm settings
#
# CeluneNorm is Celune's normalizer that cleans up your text to be more TTS friendly
# it may however lose a letter occasionally or mix up short sequences
use_normalizer: false

# smart speech buffering
#
# Celune can adapt its pre-playback buffer to recent and live generation speed
# so slower generations build more headroom while fast realtime generations
# start speaking immediately
smart_buffer:
  enabled: true
  realtime_speed: 1.05
  protected_playback_seconds: 20.0
  minimum_seconds: 0.35
  min_speed_sample_seconds: 0.75
  max_seconds: 20.0
  complete_below_speed: 0.5

# playback CPU protection
#
# Keep fast generation from building an unbounded audio backlog. When the
# queue or playback-ahead limit is reached, generation waits for playback.
pipeline_cpu:
  enabled: true
  max_queue_items: 8
  max_buffer_seconds: 4.0
  max_drain_items: 1
  yield_seconds: 0.001

# IPA auto-conversion
# Celune can auto-convert IPA strings into English-like approximations
# if you want to try speaking the IPA raw, disable this feature
#
# false = IPA is converted to English like compounds
# true = IPA is treated as is
ipa: false

# Global operation mode:
# speak    - speech-only operation without Persona or agent features
# converse - Persona conversation without agent features
# agent    - reserved for future agent features; currently redirected to converse
mode: converse

# VRAM target settings
# we recommend choosing medium as a safe baseline for low VRAM users
# the sane choice for users wanting to use Persona is the high preset
#
# low (CPU/6GB) - Celune Mini (Pocket TTS) or SeedVC (GPU only) / Qwen3 0.6B+ normalizer CPU (caution: choosing Qwen may harm outputs)
# medium (8GB) - Qwen3 1.7B + normalizer CPU
# high (12GB) - Qwen3 1.7B + Persona 4-bit + normalizer CPU; Mini and Qwen3 only when Persona is enabled
# xhigh (16GB+) - everything allowed, including dots.tts MF and VoxCPM2 with Persona 8-bit + normalizer GPU
vram: medium

# sleep mode behavior
#
# Celune can automatically enter sleep mode to save your resources while idle
sleep:
  # should Celune sleep?
  enabled: true
  # how long to idle for in minutes before going to sleep
  timeout: 10
  # what to unload when entering sleep mode?
  unload:
    persona: true
    normalizer: true
    tts: false

# Celune API settings
#
# Celune API allows users to interact with Celune over the network,
# and also lets IoT devices use her abilities
api:
  # enabled?
  enabled: true
  # where to bind
  host: 127.0.0.1
  # what port to bind
  port: 2060
  # what authentication token users must use
  # the token can also be set with CELUNE_API_TOKEN
  token: null
  # how many generations are allowed every minute
  # strongly recommended for public APIs
  rate_limit_per_minute: 60

# Persona settings
#
# Persona is Celune's thinking system using RAG (Retrieval Augmented Generation) to let characters
# keep a conversational context and remember you as you speak with said characters
# it uses Qwen/Qwen3-VL-4B-Instruct to ensure it can run on consumer hardware
persona:
  # enabled?
  enabled: true
  # load same-named Persona Markdown files from the Celune app-data character directory
  debug_overrides: false
  # which Qwen model to use? (in case you want to use an FT or uncensored version)
  model_id: Qwen/Qwen3-VL-4B-Instruct
  # model_id: huihui-ai/Huihui-Qwen3-VL-4B-Instruct-abliterated
  # Hugging Face Whisper model used by CTRL+R Persona voice input
  speech_model_id: openai/whisper-large-v3-turbo
  # Whisper language code/name, or auto to detect the spoken language
  speech_language: auto
  # Extra silence after VAD stops hearing speech before submitting voice input
  speech_end_delay_seconds: 1.5
  # memory settings
  memory:
    # how much do you want Celune to remember
    max_short_term_messages: 20
    # use the local Persona model to classify durable facts not matched by rules
    auto_classifier: true
    auto_classifier_min_confidence: 0.82
    auto_classifier_max_candidates: 3
    # summarize older turns instead of carrying the complete history forward
    context_compaction_enabled: true
    context_compaction_keep_recent_messages: 8
    context_summary_max_characters: 1200
    # optional root for character-scoped records at <character>/memory/records.json
    storage_dir: null
    # minimum cosine similarity for semantic long-term memory retrieval
    semantic_similarity_threshold: 0.62
    # token overlap required by the safe fallback matcher when embeddings are unavailable
    fallback_token_overlap_threshold: 1
    # transformer model used for semantic long-term memory retrieval when available locally
    semantic_embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # use persona or speak directly?
  talkback: true
