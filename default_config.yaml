# TTS backend (dictated by VRAM target)
#
# qwen3 = faster, less expressive
# voxcpm2 = slower, high quality
backend: null

# Qwen3 TTS settings
#
# clone = clone from CEVOICE bundles
# native = deprecated compatibility mode using Celune native models
qwen3_mode: clone
# x-vectors make Celune adhere to the reference more strongly
qwen3_x_vector_only: true

# CEVOICE voice selection
#
# default voices are in the "default" pack and are usable for most
voice_bundle: default

# developer mode
#
# this will enable verbose logging, detailed tracebacks,
# and auto-voice analysis upon end of utterance
dev: false

# headless mode / Celune embedded framework
#
# this will disable the UI and only API and extensions can make
# Celune perform any actions
headless: false
# don't use ANSI colors in headless interface (defaulting to white)
headless_nocolor: false

# theme palette
#
# CEVOICE packs can define how the app theme looks like
# the default uses #CEBAFF accent and #1D1826 background colors
theme: dark

# CeluneNorm settings
#
# CeluneNorm is Celune's normalizer that cleans up your text to be more TTS friendly
use_normalizer: false

# VRAM target settings
# we recommend medium as a safe baseline for low VRAM users
#
# low (6GB) - Qwen3 0.6B + normalizer CPU (caution: may generate bad outputs more often)
# medium (8GB) - Qwen3 1.7B + normalizer CPU
# high (12GB) - Qwen3 1.7B / VoxCPM2 + Persona 4-bit + normalizer CPU
# xhigh (16GB+) - everything allowed + Persona 8-bit + normalizer GPU
vram: high

# sleep mode behavior
#
# Celune can automatically enter sleep mode to save your resources while idle
sleep:
  # should Celune sleep?
  enabled: true
  # how long to idle for in minutes before going to sleep
  timeout: 10
  # what to unload when entering sleep mode?
  unload:
    persona: true
    normalizer: true
    tts: false

# Celune API settings
#
# Celune API allows users to interact with Celune over the network,
# and also lets IoT devices use her abilities
api:
  # enabled?
  enabled: true
  # where to bind
  host: 0.0.0.0
  # what port to bind
  port: 2060
  # what authentication token users must use
  # the token can also be set with CELUNE_API_TOKEN
  token: null
  # how many generations are allowed every minute
  # strongly recommended for public APIs
  rate_limit_per_minute: 60

# Persona settings
#
# Persona is Celune's thinking system using RAG (Retrieval Augmented Generation) to let characters
# keep a conversational context and remember you as you speak with said characters
# it uses Qwen/Qwen2.5-VL-3B-Instruct to ensure it can run on consumer hardware
persona:
  # enabled?
  enabled: true
  # which Qwen model to use? (in case you want to use an FT)
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  # memory settings
  memory:
    # how much do you want Celune to remember
    max_short_term_messages: 20
  # use persona or speak directly?
  talkback: true
