[project]
name = "celune"
version = "5.2.0"
description = "\"Your voice, your way.\""
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "@celunah" }
]

dependencies = [
    # AI stack
    # Wow, up to date!
    "torch==2.15.0+cu132",
    "torchao==0.18.0",
    "torchaudio==2.11.1+cu132",
    # This package is not required if you want to use Persona in text-only mode,
    # or Celune operates in speech-only mode.
    "torchvision==0.29.2+cu132",
    # If not installed, Hugging Face falls back to the older Git LFS way of downloading models.
    "hf-xet",
    "accelerate",
    "bitsandbytes",
    "qwen-vl-utils",
    "huggingface-hub>=1.31.0,<3.0.0",
    "safetensors",
    "sentencepiece",
    "transformers>=5.21.0,<6.0.0",
    # Some models are ONNX models rather than PyTorch ones, so this package allows them to run.
    "onnxruntime>=1.22.0",

    # Audio processing
    "numpy",
    "scipy",
    # Pedalboard 0.9.20 and above require AVX-512
    "pedalboard==0.9.26",
    "pyrubberband",
    "soundfile",
    "sounddevice",
    "zstandard",
    # Explicitly used by the self-analysis pass, used as a dependency elsewhere.
    "librosa",

    # UX & UI
    "textual",
    "rich",
    # Early terminal selectors need this library.
    "readchar",
    # "You do want me to glow, do you?" - she says.
    # Install this package and set up OpenRGB. You'll thank me later, or rather, her.
    "openrgb-python",
    # For voice assessment graphs
    "matplotlib",

    # Others
    "psutil",
    "platformdirs",
    "pyyaml",
    # For signature verification.
    "cryptography",
    # Used to get repository information.
    # The Celune repository is used to update the software in place as needed.
    "GitPython",
    "httpx",
    # Used to detect language of input.
    "lingua-language-detector",
    "iso639-lang",
    # She can also play literal [music].
    "yt-dlp[default]",
    # Lua runtime for running Celune extensions
    "lupa",
    # Needed for live voice capture to tell when you're speaking.
    "silero-vad",
]

[project.urls]
Homepage = "https://github.com/celunah"
Repository = "https://github.com/celunah/celune"
Issues = "https://github.com/celunah/celune/issues"

[tool.setuptools.package-data]
celune = ["lang/*.json", "assets/*", "release_keyring.json"]

[tool.setuptools.data-files]
voices = ["voices/*.cevoice"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]
torchaudio = [{ index = "pytorch-cu132" }]
torchvision = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[dependency-groups]
# Please install in order to not SLOP her up.
dev = [
	# Linters
    "ruff==0.17.4",
    # PLEASE, someone make a faster Pylint alternative! She's standing here for so long cuz Pylint holds her hostage!
    "pylint",
    # Type checker
    "pyrefly",
    # Test suite
    "pytest",
    # Installing these permits parallel test execution.
    # Parallel tests consume lots of memory. If your system is weaker, run the basic test suite instead.
    "pytest-testmon",
    "pytest-xdist",
    # Extra CI tools
    # Docstring stats
    "docstr-coverage",
    # Dead code detection
    "vulture",
    # LOC counting
    "pygount",
    "loguru",
    # Coverage stats
    "coverage",
    # This package is required to compile Celune into a properly packaged binary, bypassing the need to run Python.
    "nuitka==4.3.5",
    # If not installed, type checkers may complain.
    "types-pyyaml",
    "types-psutil",
    "types-tqdm",
    # CI commands
    # `uv run poe [...]`
    "poethepoet",
]

[project.optional-dependencies]
# Install to run Celune's web integrations, such as the API, web interface and MCP servers.
api = [
    # API packages
	"uvicorn",
	"fastapi",
    "python-multipart",
    "pydantic",
    # Web interface
    "gradio",
    # MCP server
    "mcp",
]

# Install to use OpenZL-compressed CECHAR v4 packages in Celune.
cechar4-openzl = [
    "openzl",
]

# These dependency groups are currently handled internally by Celune backends and the Celune core no longer
# depends on them. Explicit installation is not required anymore, so the groups have been commented out.
#
# Qwen3
# The original Qwen-based classic Celune backend. Balanced sound quality and speed.

# VoxCPM2
# A high-end diffusion based Celune backend with high fidelity and expressiveness. Slower, but way more expressive.

# dots.tts
# An alternative diffusion based Celune backend with high fidelity and speaker similarity.
# Slowest, but very speaker accurate.

# Pocket TTS (AKA Celune Mini)
# A cheap on compute Celune backend providing an exceptional sound quality. Fastest, with an exceptional sound quality
# to size ratio.

# Ming3
# A fast and low-latency Celune backend which provides a good amount of expression.
# Lighter on memory, and it supports a variety of languages.

# SeedVC
# A voice conversion backend allowing you to speak in your character voices directly. It does not use TTS, using it
# will disable TTS features.

# SoulX-Singer
# A singing backend which allows Celune to sing. Light on memory, but only works in English. Chinese singing inputs
# are not available. Text input is disabled while active. CESN is the only supported input method.
# Functions that require TTS are not available.

# CI specific options
# Don't touch it, unless you want SLOP!
[tool.celtest]
display_name = "Celune"

[tool.pytest.ini_options]
markers = [
    "e2e: exercises a user-facing workflow across application layers",
]
filterwarnings = [
     # 'silero-vad' uses old legacy PyTorch JIT syntax:
     # Python 3.12 and 3.13 emit this warning.
     "ignore:`torch\\.jit\\.load` is deprecated\\. Please switch to `torch\\.export`\\.:DeprecationWarning",
     # Python 3.14 emits this warning.
     "ignore:`torch\\.jit\\.load` is not supported in Python 3\\.14\\+ and may break\\. Please switch to `torch\\.export`\\.:DeprecationWarning",
     # This is emitted by PyTorch 2.15.
     "ignore:`torch\\.jit\\.load` is deprecated\\. Please switch to `torch\\.export`\\.:FutureWarning",
]

[tool.ruff.lint]
ignore=[
    # Celune does not use PEP604 typing syntax
    "UP007",  # non-pep604-annotation-union
    "UP045",  # non-pep604-annotation-optional
    # some traps require an `except Exception:` statement
    "BLE001",  # blind-except
    # Celune uses a non-isort-compliant import sorting strategy
    "I001",  # unsorted imports
]

[tool.ruff.lint.isort]
length-sort = true

[tool.pylint.main]
disable=[
    # some code requires access to a protected member, e.g. Class._method()
    "W0212",  # protected-access
    # FIXME, TODO, etc. should not cause a CI failure
    "W0511",  # fixme
    # some code requires variables and objects to be brought in from a different scope using the `global` statement
    "W0603",  # global-statement
    # some traps require an `except Exception:` statement
    "W0718",  # broad-exception-caught
    # Pylint's cyclic import detection files complaints about cyclic imports that Python is able to handle just fine
    "R0401",  # cyclic-import
    # Celune codestyle requires very large classes
    "R0901",  # too-many-ancestors
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0904",  # too-many-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0916",  # too-many-boolean-expressions
    "R0917",  # too-many-positional-arguments
    "R1702",  # too-many-nested-blocks
    # ML variable names often are called with "invalid names"
    "C0103",  # invalid-name
    # some parts of Celune require a lot of lines
    "C0302",  # too-many-lines
    # Celune lazy loads dependencies at runtime
    "C0415",  # import-outside-toplevel
    # some dependencies may still work during runtime but fail to detect members during CI
    "I1101",  # c-extension-no-member
]

ignore-paths=[
    "celune/backends/tts",
    "celune/backends/vc",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.similarities]
min-similarity-lines = 20


[tool.pyrefly]
project-includes = [
    "celune",
    "tests",
    "scripts",
    "main.py",
    "configure.py",
]

project-excludes = [
    "celune/backends/tts/**",
    "celune/backends/vc/**",
    ".uv-cache",
]

search-path = ["."]
python-version = "3.14"
min-severity = "warn"

[tool.poe.tasks]
start = "python main.py"
test = "pytest -v tests -n 2 --dist loadfile"
test_basic = "pytest -v tests"
test_e2e = "pytest -v tests -m e2e"
test_changed = "pytest -v tests --testmon"
types = "pyrefly check"
ruff = "ruff check"
format = "ruff format --check"
lint = "pylint -j 4 celune tests main.py"
lint_basic = "pylint -j 2 celune tests main.py"
lines = "pygount --format=summary"

[tool.poe.tasks.ci]
sequence = ["ruff", "format", "lint", "types", "test_basic"]
ignore_fail = "return_non_zero"

[tool.poe.tasks.ci_basic]
sequence = ["ruff", "format", "lint_basic", "types", "test_basic"]
ignore_fail = "return_non_zero"

[tool.poe.tasks.build_configure]
cmd = "cmake --preset unsigned"

[tool.poe.tasks.build_compile]
cmd = "cmake --build --preset unsigned"

[tool.poe.tasks.build]
sequence = ["build_configure", "build_compile"]

[tool.poe.tasks.build_signed_configure]
cmd = "cmake --preset signed"

[tool.poe.tasks.build_signed_compile]
cmd = "cmake --build --preset signed"

[tool.poe.tasks.build_signed]
sequence = ["build_signed_configure", "build_signed_compile"]

[tool.poe.tasks.coverage]
cmd = "python scripts/run_coverage.py"
