[project]
name = "celune"
version = "4.2.0"
description = "Real-time AI TTS character engine with expressive voices and high-quality playback"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "@celunah" }
]

dependencies = [
    # AI stack
    # Please, only use CUDA 12.8.
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
    # This package is not required if you want to use Persona in text-only mode,
    # or Celune operates in speech-only mode.
    "torchvision==0.26.0+cu128",
    # Celune sounds best with faster-qwen3-tts 0.2.4.
    # To match this version's behavior in 0.2.5 or newer, you may need to set non_streaming_mode=True.
    # This parameter is ambiguously named, it doesn't actually disable streaming mode.
    # If it did, Celune would have a problem operating.
    "faster-qwen3-tts>=0.2.4",
    # If you want Celune to use the alternative VoxCPM2-based backend, install this package.
    # This backend may not be available on some VRAM presets. Refer to Celune's default configuration for details.
    "voxcpm>=2.0.2",
    # dots.tts is installed from Celunah's Windows-safe fork at this time.
    "dots.tts @ git+https://github.com/celunah/dots.tts",
    # Pocket TTS is a new backend added in version 4.0.0, that allows Celune to sound the part and use up very little
    # memory, just under 200 MB!
    "pocket-tts>=2.1.0",
    # If not installed, Hugging Face falls back to the older Git LFS way of downloading models.
    "hf-xet",
    "accelerate",
    "bitsandbytes",
    "qwen-vl-utils",
    # Qwen3 does not support newer versions of Hugging Face libraries at this time.
    # Celune will use Transformers 4.x for the time being.
    "huggingface-hub<1.0.0",
    "transformers<5.0.0",
    # For later usage in VoxCPM2, if the optimization path is fixed.
    # "triton>=3.6.0; sys_platform == 'linux'",
    # "triton-windows>=3.6.0; sys_platform == 'win32'",

    # Audio processing
    "numpy",
    "scipy",
    "pedalboard",
    "pyrubberband",
    "soundfile",
    "sounddevice",
    # Explicitly used by the self-analysis pass, used as a dependency elsewhere.
    "librosa",

    # UX & UI
    "textual",
    "rich",
    "readchar",
    # "You do want me to glow, do you?" - she says.
    # Install this package and set up OpenRGB. You'll thank me later, or rather, her.
    "openrgb-python",
    # Celune uses this to plot the voice graph. If developer mode is disabled, this isn't needed.
    "matplotlib",

    # Others
    "psutil",
    "platformdirs",
    "pyyaml",
    "httpx>=0.27.0,<0.29.0",
    # Used to detect language of input.
    "langdetect>=1.0.0,<2.0.0",
    "iso639-lang>=2.0.0,<3.0.0",
    "yt-dlp",
]

[project.urls]
Homepage = "https://github.com/celunah"
Repository = "https://github.com/celunah/celune"
Issues = "https://github.com/celunah/celune/issues"

# Why does CodeRabbit think I'm uploading Celune to PyPI?
# Her package is not standalone.
[tool.setuptools.package-data]
celune = ["assets/*.wav"]

[tool.setuptools.data-files]
voices = ["voices/*.cevoice"]

# "CUDA 13.0 does exist, but I probably should wait a little more." - she says.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
# Install to run CI workflows.
dev = [
    # Is there any faster unit test-specific library to use here?
    "pytest",
    # "I really hate pyright." - she says.
    "pyrefly",
    "pylint",
    # Docstrings matter, so everyone can read the code more easily.
    "docstr-coverage",
    "ruff",
    # This package is required to compile Celune into a properly packaged binary, bypassing the need to run Python.
    "nuitka>=4.1.2",
    # If not installed, type checkers may complain.
    "types-pyyaml",
    "types-psutil",
    "types-tqdm",
]

[project.optional-dependencies]
# Install to run the Celune API.
api = [
	"uvicorn",
	"fastapi",
    "python-multipart",
    "pydantic",
]

[tool.pytest.ini_options]
filterwarnings = "ignore::DeprecationWarning"
