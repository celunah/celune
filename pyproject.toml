[project]
name = "celune"
version = "5.0.0"
description = "Real-time AI TTS character engine for all use cases"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "@celunah" }
]

dependencies = [
    # AI stack
    # Wow, up to date!
    "torch==2.13.0+cu130",
    "torchaudio==2.11.0+cu130",
    # This package is not required if you want to use Persona in text-only mode,
    # or Celune operates in speech-only mode.
    "torchvision==0.28.0+cu130",
    # If not installed, Hugging Face falls back to the older Git LFS way of downloading models.
    "hf-xet",
    "accelerate",
    "bitsandbytes",
    "qwen-vl-utils",
    "huggingface-hub",
    "safetensors",
    "sentencepiece",
    "transformers>=5.0.0,<6.0.0",

    # Audio processing
    "numpy",
    "scipy",
    # Pedalboard 0.9.20 and above require AVX-512
    "pedalboard==0.9.19",
    "pyrubberband",
    "soundfile",
    "sounddevice",
    "zstandard",
    # Explicitly used by the self-analysis pass, used as a dependency elsewhere.
    "librosa",

    # UX & UI
    "textual",
    "rich",
    "readchar",
    # "You do want me to glow, do you?" - she says.
    # Install this package and set up OpenRGB. You'll thank me later, or rather, her.
    "openrgb-python",
    # Celune uses this to plot the voice graph. If developer mode is disabled, this isn't needed.
    "matplotlib",

    # Others
    "psutil",
    "platformdirs",
    "pyyaml",
    "httpx>=0.27.0,<0.29.0",
    # Used to detect language of input.
    "lingua-language-detector>=2.2.0,<3.0.0",
    "iso639-lang>=2.0.0,<3.0.0",
    "yt-dlp[default]>=2026.08.19",
]

[project.urls]
Homepage = "https://github.com/celunah"
Repository = "https://github.com/celunah/celune"
Issues = "https://github.com/celunah/celune/issues"

[tool.setuptools.package-data]
celune = ["assets/*.wav", "lang/*.json"]

[tool.setuptools.data-files]
voices = ["voices/*.cevoice"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
# Install to run CI workflows.
dev = [
    # Pytest plus opt-in parallel and incremental test execution.
    "pytest",
    "pytest-testmon",
    "pytest-xdist",
    # "I really hate pyright." - she says.
    "pyrefly>=1.2.0",
    "pylint",
    # Docstrings matter, so everyone can read the code more easily.
    "docstr-coverage",
    "ruff==0.16.0",
    # How many useless functions do we have?
    "vulture",
    # How many lines do we have?
    "pygount",
    "loguru",
    # This package is required to compile Celune into a properly packaged binary, bypassing the need to run Python.
    # Canonically pinned, I know. 412 is her number, Nuitka happened to be on that version.
    "nuitka==4.1.2",
    # If not installed, type checkers may complain.
    "types-pyyaml",
    "types-psutil",
    "types-tqdm",
    # Gives Celune "npm run"-like commands.
    "poethepoet>=0.48.0",
]

[project.optional-dependencies]
# Install to run the Celune API.
api = [
	"uvicorn",
	"fastapi",
    "python-multipart",
    "pydantic",
    "gradio",
]

# Install to use OpenZL-compressed CECHAR v4 packages in Celune.
openzl = [
    "openzl",
]

# These dependency groups are currently handled internally by Celune backends and the Celune core no longer
# depends on them. Explicit installation is not required anymore, so the groups have been commented out.
#
# The original Qwen-based classic Celune backend. Balanced sound quality and speed.
# qwen3 = [
#     # Celune sounds best with faster-qwen3-tts 0.2.6.
#     # To match this version's behavior in newer releases, you may need to set non_streaming_mode=True.
#     # This parameter is ambiguously named, it doesn't actually disable streaming mode.
#     # If it did, Celune would have a problem operating.
#     "faster-qwen3-tts==0.2.6",
# ]

# A high-end diffusion based Celune backend with high fidelity and expressiveness. Slower, but way more expressive.
# voxcpm2 = [
#     # Celune requires a streaming-capable version of the voxcpm library. Versions newer than 1.5.0 support it, however
#     # VoxCPM2 may require at least version 2.0.0.
#     "voxcpm>=2.0.0",
# ]

# An alternative diffusion based Celune backend with high fidelity and speaker similarity.
# Slowest, but very speaker accurate.
# dotstts = [
#     # Celune's dots.tts backend uses a forked version that removes an unnecessary requirement that may
#     # fail to build on Windows systems. Do not try to use the upstream package.
#     "dots.tts @ git+https://github.com/celunah/dots.tts",
# ]

# A cheap on compute Celune backend providing an exceptional sound quality. Fastest, with an exceptional sound quality
# to size ratio.
# mini = [
#     "pocket-tts>=2.1.0",
# ]

# An experimental Celune backend supporting the entire GPT-SoVITS family: v1, v2/Pro/ProPlus, v3, and v4.
# Fast, but may not work with certain voices and experiences accent drift to a varying amount, with v4 the least.
# It does not use a library. Celune reimplements the system directly, using more dependencies.
# gpt-sovits = [
#     "cn2an",
#     "ffmpeg-python",
#     "g2p-en",
#     "g2pk2",
#     "jieba-fast",
#     "ko-pron",
#     "opencc",
#     "peft<0.18.0",
#     "pypinyin",
#     "pytorch-lightning>=2.4",
#     "pyopenjtalk>=0.4.1",
#     "rotary-embedding-torch",
#     "split-lang",
#     "tojyutping",
#     "torchmetrics<=1.5",
#     "wordsegment",
#     "x-transformers",
# ]

# A voice conversion backend allowing you to speak in your character voices directly. It does not use TTS, using it
# will disable TTS features.
# seed-vc = [
#     # Celune's SeedVC backend uses a forked version that turns hard pins into "this or newer", allowing Celune
#     # to resolve it under NumPy v2. Do not try to use the upstream package, it uses an unsupported version of NumPy.
#     "seed-vc @ git+https://github.com/celunah/seed-vc.git",
# ]

# Optional AI VAD for live voice conversion capture.
live-vc-ai = [
    "silero-vad",
]

# CI specific options
# Don't touch it, unless you want SLOP!
[tool.pytest.ini_options]
filterwarnings = [
     # 'silero-vad' uses old legacy PyTorch JIT syntax:
     # Python 3.12 and 3.13 emit this warning.
     "ignore:`torch\\.jit\\.load` is deprecated\\. Please switch to `torch\\.export`\\.:DeprecationWarning",
     # Python 3.14 emits this warning.
     "ignore:`torch\\.jit\\.load` is not supported in Python 3\\.14\\+ and may break\\. Please switch to `torch\\.export`\\.:DeprecationWarning",
]

[tool.ruff.lint]
ignore=[
    # Celune does not use PEP604 typing syntax
    "UP007",  # non-pep604-annotation-union
    "UP045",  # non-pep604-annotation-optional
    # some traps require an `except Exception:` statement
    "BLE001",  # blind-except
    # Celune uses a non-isort-compliant import sorting strategy
    "I001",  # unsorted imports
]

[tool.ruff.lint.isort]
length-sort = true

[tool.pylint.main]
disable=[
    # some code requires access to a protected member, e.g. Class._method()
    "W0212",  # protected-access
    # FIXME, TODO, etc. should not cause a CI failure
    "W0511",  # fixme
    # some code requires variables and objects to be brought in from a different scope using the `global` statement
    "W0603",  # global-statement
    # some traps require an `except Exception:` statement
    "W0718",  # broad-exception-caught
    # Pylint's cyclic import detection files complaints about cyclic imports that Python is able to handle just fine
    "R0401",  # cyclic-import
    # Celune codestyle requires very large classes
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0904",  # too-many-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0916",  # too-many-boolean-expressions
    "R0917",  # too-many-positional-arguments
    "R1702",  # too-many-nested-blocks
    # ML variable names often are called with "invalid names"
    "C0103",  # invalid-name
    # some parts of Celune require a lot of lines
    "C0302",  # too-many-lines
    # Celune lazy loads dependencies at runtime
    "C0415",  # import-outside-toplevel
    # some dependencies may still work during runtime but fail to detect members during CI
    "I1101",  # c-extension-no-member
]

ignore-paths=[
    "celune/backends/tts",
    "celune/backends/vc",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.similarities]
# Keep duplicate-code focused on substantial copied blocks; short overlaps are
# expected in mirrored UI adapters, exports, and test fixtures.
min-similarity-lines = 20


[tool.pyrefly]
project-includes = [
    "celune",
    "tests",
    "scripts",
    "main.py",
    "configure.py",
]

project-excludes = [
    "celune/backends/tts/**",
    "celune/backends/vc/**",
    ".uv-cache",
]

search-path = ["."]
python-version = "3.14"
min-severity = "warn"

[tool.poe.tasks]
start = "python main.py"
test = "pytest -v tests -n 3 --dist loadfile"
test_serial = "pytest -v tests"
test_changed = "pytest -v tests --testmon"
types = "pyrefly check"
ruff = "ruff check"
format = "ruff format --check"
lint = "pylint -j 0 celune tests main.py"
lines = "pygount --format=summary"

[tool.poe.tasks.ci]
sequence = ["ruff", "format", "lint", "types", "test"]
ignore_fail = "return_non_zero"

[tool.poe.tasks.build]
control.expr = "sys.platform"

[[tool.poe.tasks.build.switch]]
case = "win32"
cmd = "pwsh -NoProfile -File scripts/build_nuitka.ps1"

[[tool.poe.tasks.build.switch]]
case = ["linux", "darwin"]
cmd = "bash scripts/build_nuitka.sh"
