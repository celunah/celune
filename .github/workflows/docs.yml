name: Documentation

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".readthedocs.yaml"
      - "mkdocs.yml"
      - ".markdownlint.json"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".readthedocs.yaml"
      - "mkdocs.yml"
      - ".markdownlint.json"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            docs/**/*.md

      - name: Build MkDocs site
        run: uv run --with-requirements docs/requirements.txt mkdocs build --strict
