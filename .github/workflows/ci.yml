name: Celune CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  python-checks:
    name: Anti AI Slop & Vibe Coding Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: python3 scripts/ci_warnings.py -- bash -c "sudo apt-get update && sudo apt-get install portaudio19-dev"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: python3 scripts/ci_warnings.py -- uv sync --dev --all-extras

      - name: Verify formatting
        run: python3 scripts/ci_warnings.py -- uv run ruff format --check .

      - name: Run lint
        run: |
          python3 scripts/ci_warnings.py -- uv run pylint -j 0 celune tests main.py

      - name: Type check
        run: |
          python3 scripts/ci_warnings.py -- uv run pyrefly check

      - name: Check docstring coverage
        run: |
          python3 scripts/ci_warnings.py -- uv run docstr-coverage -i -P --fail-under 80 celune tests main.py || {
            echo "::warning::Docstring coverage is below 80%. Try adding more missing docstrings."
          }

      - name: Run unit tests
        run: python3 scripts/ci_warnings.py -- uv run poe test_basic

      - name: Import smoke test
        run: |
          python3 scripts/ci_warnings.py -- uv run python -c "import celune; print(dir(celune))"

  launcher-build-linux:
    name: Linux Launcher Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc wget zip desktop-file-utils libfuse2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: python3 scripts/ci_warnings.py -- uv sync --dev

      - name: Install appimagetool
        run: |
          python3 ./scripts/ci_warnings.py -- bash -c "wget -O /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage && chmod +x /tmp/appimagetool && sudo mv /tmp/appimagetool /usr/local/bin/appimagetool"

      - name: Build Linux launcher artifacts
        run: |
          python3 ./scripts/ci_warnings.py -- bash ./scripts/build_nuitka.sh
          test -x bin/celune
          test -x bin/celune-bin
          test -f bin/celune.AppImage
          test -f bin/Celune-linux-x64.zip

      - name: Upload Linux launcher artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Celune-linux-x64
          path: bin/

  launcher-build-windows:
    name: Windows Launcher Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        shell: powershell
        run: python .\scripts\ci_warnings.py -- uv sync --dev --extra api

      - name: Build Windows launcher artifacts
        shell: powershell
        run: |
          python .\scripts\ci_warnings.py -- powershell -ExecutionPolicy Bypass -File .\scripts\build_nuitka.ps1
          if (!(Test-Path .\bin\celune.exe)) { throw "bin/celune.exe not found" }
          if (!(Test-Path .\bin\celune-bin.exe)) { throw "bin/celune-bin.exe not found" }
          if (!(Test-Path .\bin\Celune-win-x64.zip)) { throw "bin/Celune-win-x64.zip not found" }

      - name: Upload Windows launcher artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Celune-win-x64
          path: bin/

  notify-failure:
    name: Comment on CI Failure
    runs-on: ubuntu-slim
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs:
      - python-checks
      - launcher-build-linux
      - launcher-build-windows

    if: >-
      ${{
        always() &&
        (
          needs.python-checks.result != 'success' ||
          needs.launcher-build-linux.result != 'success' ||
          needs.launcher-build-windows.result != 'success'
        )
      }}

    steps:
      - name: Comment on pull request or commit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PYTHON_CHECKS_RESULT: ${{ needs.python-checks.result }}
          LINUX_BUILD_RESULT: ${{ needs.launcher-build-linux.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.launcher-build-windows.result }}

        run: |
          failed_jobs=""
          successful_jobs=""

          add_result() {
            name="$1"
            result="$2"

            if [ "$result" = "success" ]; then
              successful_jobs="${successful_jobs}- ${name}: success"$'\n'
            else
              failed_jobs="${failed_jobs}- ${name}: ${result}"$'\n'
            fi
          }

          add_result \
            "Anti AI Slop & Vibe Coding Checks" \
            "$PYTHON_CHECKS_RESULT"

          add_result \
            "Linux Launcher Build" \
            "$LINUX_BUILD_RESULT"

          add_result \
            "Windows Launcher Build" \
            "$WINDOWS_BUILD_RESULT"

          body="$(printf \
            "Detected potential slop or an incomplete CI run in commit \`%s\`.\n\nFailed or incomplete checks:\n%s\nSuccessful checks:\n%s\nPlease check the logs and unslop your code:\n%s\n" \
            "$SHA" \
            "$failed_jobs" \
            "$successful_jobs" \
            "$RUN_URL"
          )"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
          else
            gh api \
              --method POST \
              "repos/$REPO/commits/$SHA/comments" \
              -f body="$body"
          fi
